name: Release

# Fires on any tag matching `v*`. Expected flow:
#   1. bump package.json + .claude-plugin/plugin.json to the new version,
#      commit, push to main
#   2. git tag v0.4.4 && git push origin v0.4.4
#   3. this workflow: tests → npm publish (OIDC) → GitHub Release
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure this GitHub Environment in repo Settings → Environments
    # → release. npm's trusted-publisher entry must also reference it.
    environment: release

    permissions:
      # Required for npm OIDC trusted publishing.
      id-token: write
      # Required for `gh release create`.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gh can walk back to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          # Mandatory for OIDC auth to kick in even though no token is used.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Test gate. Stable tags (v0.X.Y) MUST pass. Pre-release tags
      # (v0.X.Y-rc.N) tolerate up to 8 known-flaky tests that pass in
      # isolation but fail under concurrent runner state contention —
      # primarily log-tail / hook-event-tail / a couple of sessions
      # tests. The flake set is documented in 0.11.0-channels-status.md
      # and predates 0.12. The version source for the gate decision is
      # package.json (not the tag name); shell variables only — no user
      # event payloads — so no injection surface.
      - name: Run tests (strict for stable, tolerant for RC)
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "$PKG_VERSION" in
            *-rc.*|*-alpha.*|*-beta.*)
              echo "Pre-release tag '$PKG_VERSION' — tolerating up to 8 documented flaky failures."
              npm test 2>&1 | tee /tmp/npm-test.log
              FAILS=$(grep -E "^ℹ fail " /tmp/npm-test.log | tail -1 | awk '{print $NF}')
              if [ -z "$FAILS" ]; then FAILS=0; fi
              if [ "$FAILS" -le 8 ]; then
                echo "::warning::npm test reported $FAILS failures — within documented flake budget (≤8) for pre-release."
                exit 0
              else
                echo "::error::npm test reported $FAILS failures — exceeds documented flake budget (8)."
                exit 1
              fi
              ;;
            *)
              echo "Stable tag '$PKG_VERSION' — strict test gate."
              npm test
              ;;
          esac

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" \!= "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Node 22 ships with npm 10.x; trusted publishing requires npm >= 11.5.1.
      # Rather than upgrading npm in-place (breaks with a promise-retry module
      # lookup on ubuntu-latest's hosted toolcache), use npx to run a pinned
      # npm 11 for just the publish step. `-y` suppresses the confirmation
      # prompt; it downloads npm 11 into the npm cache on first use and
      # leaves the system npm untouched.
      #
      # Do NOT set NODE_AUTH_TOKEN (not even empty). npm's OIDC path only
      # activates when no auth token env is present.
      # Pre-release tags (e.g. v0.8.0-rc.1) publish under the `next`
      # dist-tag so `npm install polygram` (default = latest) keeps
      # pulling the last stable. Stable tags (v0.8.0) publish under
      # `latest` as usual. The deploy skill pins exact versions, so
      # the dist-tag only matters for casual installers.
      - name: Publish to npm (OIDC)
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "$PKG_VERSION" in
            *-*) DIST_TAG="next" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "Publishing $PKG_VERSION under dist-tag $DIST_TAG"
          npx -y npm@latest publish --access public --tag "$DIST_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "$PKG_VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
            *)   PRERELEASE_FLAG="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG
